<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register — MediFind</title>
  <link rel="stylesheet" href="css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <header>
    <div class="nav-container">
      <a href="index.html" class="logo">MediFind</a>
      <div class="nav-links">
        <a href="index.html">Back to Search</a>
      </div>
    </div>
  </header>

  <main class="container" style="max-width: 480px; margin-top: 4rem;">
    <div class="search-card">
      <h2 style="font-size: 1.5rem; font-weight: 800; margin-bottom: 0.5rem; text-align: center;">Create MediFind Account</h2>
      <p style="color: #64748b; font-size: 0.9rem; text-align: center; margin-bottom: 1.5rem;">Join to save searches and track local medicine availability</p>

      <form id="register-form">
        <div class="form-group" style="margin-bottom: 1rem;">
          <label for="name">Full Name</label>
          <input type="text" id="name" required placeholder="e.g. Arun Kumar">
        </div>

        <div class="form-group" style="margin-bottom: 1rem;">
          <label for="email">Email Address</label>
          <input type="email" id="email" required placeholder="name@example.com">
        </div>

        <div class="form-group" style="margin-bottom: 1rem;">
          <label for="phone">Phone Number (Optional)</label>
          <input type="tel" id="phone" placeholder="+91 98400 00000">
        </div>

        <div class="form-group" style="margin-bottom: 1.5rem;">
          <label for="password">Password (min 6 characters)</label>
          <input type="password" id="password" required minlength="6" placeholder="••••••••">
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; padding: 0.75rem;">Create Account</button>
      </form>

      <div style="margin-top: 1.5rem; padding-top: 1rem; border-top: 1px solid var(--border); font-size: 0.85rem; color: #64748b; text-align: center;">
        Already have an account? <a href="login.html" style="color: var(--primary); font-weight: 700;">Sign in here</a>
      </div>
    </div>
  </main>

  <script src="js/api.js"></script>
  <script>
    document.getElementById('register-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const name = document.getElementById('name').value.trim();
      const email = document.getElementById('email').value.trim();
      const phone = document.getElementById('phone').value.trim();
      const password = document.getElementById('password').value;

      try {
        const res = await MediFindAPI.register(name, email, password, phone);
        localStorage.setItem('medifind_token', res.token);
        localStorage.setItem('medifind_user', JSON.stringify(res.user));
        alert('Account created successfully! Welcome to MediFind.');
        window.location.href = 'index.html';
      } catch (err) {
        alert(err.message || 'Registration failed.');
      }
    });
  </script>
</body>
</html>
