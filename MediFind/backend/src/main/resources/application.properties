# =========================================================================
# MediFind Spring Boot Application Configuration
# College Team Project: Medicine Availability & Nearby Pharmacy Finder
# =========================================================================

# Application Server
server.port=8080
server.servlet.context-path=/

# MySQL Database Configuration
# Replace 'root' and 'password' with your local MySQL credentials
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/medifind_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Logging
logging.level.com.medifind=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG

# Custom App Properties
medifind.default.locality=Chromepet, Chennai
medifind.default.latitude=12.9516
medifind.default.longitude=80.1462
medifind.default.search-radius-km=5.0

